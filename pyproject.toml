[project]
name = "investment-assistant"
version = "0.1.0"
description = "Investment assistant prototype based on LangGraph and MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Boris Smorodin" },
]
dependencies = [
    "matplotlib>=3.8",
    "apimoex>=1.3",
    "clickhouse-connect>=0.7",
    "fastmcp>=2.0",
    "feedparser>=6.0",
    "langchain-mcp-adapters",
    "langchain-openai",
    "langgraph>=0.2",
    "numpy",
    "openai",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "requests",
    "scipy",
    "sqlglot",
    "streamlit>=1.35",
    "structlog",
    "typer",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "servers"]

[tool.hatch.build.targets.wheel]
packages = ["config", "orchestrator", "servers", "ui", "react_agent"]

